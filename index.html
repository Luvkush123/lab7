<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematical Calculator</title>
    <!-- Clean Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>Simple Calculator</h1>
            <p>Perform basic arithmetic calculations</p>
        </header>

        <main class="calculator-card">
            <form id="calcForm" novalidate>
                <!-- First Number -->
                <div class="form-group">
                    <label for="num1">First Number</label>
                    <input 
                        type="number" 
                        id="num1" 
                        placeholder="Enter first value" 
                        step="any" 
                        required
                    >
                    <span class="error-text" id="num1Error"></span>
                </div>

                <!-- Operation Selection -->
                <div class="form-group">
                    <label>Operation</label>
                    <div class="operator-group" role="radiogroup" aria-label="Math Operations">
                        <button type="button" class="op-btn active" data-op="add" title="Addition">
                            <span class="symbol">+</span>
                            <span class="name">Add</span>
                        </button>
                        <button type="button" class="op-btn" data-op="subtract" title="Subtraction">
                            <span class="symbol">−</span>
                            <span class="name">Subtract</span>
                        </button>
                        <button type="button" class="op-btn" data-op="multiply" title="Multiplication">
                            <span class="symbol">×</span>
                            <span class="name">Multiply</span>
                        </button>
                        <button type="button" class="op-btn" data-op="divide" title="Division">
                            <span class="symbol">÷</span>
                            <span class="name">Divide</span>
                        </button>
                    </div>
                </div>

                <!-- Second Number -->
                <div class="form-group">
                    <label for="num2">Second Number</label>
                    <input 
                        type="number" 
                        id="num2" 
                        placeholder="Enter second value" 
                        step="any" 
                        required
                    >
                    <span class="error-text" id="num2Error"></span>
                </div>

                <!-- Action Buttons -->
                <div class="button-row">
                    <button type="submit" class="btn btn-primary" id="calcBtn">Calculate</button>
                    <button type="button" class="btn btn-secondary" id="clearBtn">Clear</button>
                </div>
            </form>

            <!-- Result Display -->
            <div class="result-box" id="resultBox">
                <div class="result-header">
                    <span class="result-title">Result</span>
                    <span class="result-equation" id="resultEquation"></span>
                </div>
                <div class="result-value" id="resultValue">—</div>
                <div class="result-message" id="resultMessage"></div>
            </div>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
